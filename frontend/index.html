<body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><span>Sunrise<br><small>Tuition Centre</small></span></div><p class="eyebrow">Workspace</p><nav aria-label="Main navigation"><button class="nav-item active" data-view="dashboard">⌂ Overview</button><button class="nav-item" data-view="classes">▦ Classes <b id="nav-classes">0</b></button><button class="nav-item" data-view="teachers">♧ Teachers <b id="nav-teachers">0</b></button><button class="nav-item" data-view="students">◉ Students <b id="nav-students">0</b></button></nav><div class="sidebar-foot"><span class="status-dot"></span>Local preview mode</div></aside><main><header class="topbar"><div><span class="crumb">SUNRISE / </span><span id="page-label">OVERVIEW</span></div><button class="avatar" aria-label="Account">SC</button></header><div id="app" class="content"></div></main></div>
